# Builds the photobooth4u Android Kiosk APK (android/) on GitHub Actions.
# Run it from the repo's Actions tab ("Android app" -> Run workflow), or push a
# tag like android-v1.0.0 to attach the APK to a GitHub release.
name: Android app

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Bundle latest booth page into assets
        working-directory: .
        run: |
          mkdir -p android/app/src/main/assets
          cp protected/booth.html android/app/src/main/assets/booth.html
      - name: Generate launcher icons from source
        working-directory: .
        run: |
          pip install Pillow --quiet
          python android/scripts/gen_icons.py android/resources/icon_source.png
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Stage APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/photobooth4u-kiosk-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: photobooth4u-android-apk
          path: android/dist/photobooth4u-kiosk-android.apk
      - if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/dist/photobooth4u-kiosk-android.apk
          make_latest: false
