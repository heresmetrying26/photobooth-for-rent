# Builds the photobooth4u iPad Kiosk app (ios/) on GitHub Actions.
# Run it from the repo's Actions tab ("iPad app" -> Run workflow), or push a
# tag like ios-v1.0.0 to attach the IPA to a GitHub release.
name: iPad app

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Bundle latest booth page into iOS resources
        run: |
          mkdir -p ios/photobooth4u
          cp protected/booth.html ios/photobooth4u/booth.html

      - name: Build Xcode Project
        run: |
          xcodebuild -project ios/photobooth4u.xcodeproj \
            -scheme photobooth4u \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          APP_PATH=$(find build -name "photobooth4u.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" dist/Payload/
          cd dist
          zip -qr photobooth4u-kiosk-ipad.ipa Payload
          rm -rf Payload
          echo "Built photobooth4u-kiosk-ipad.ipa ($(stat -f%z photobooth4u-kiosk-ipad.ipa) bytes)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photobooth4u-ipad-ipa
          path: dist/photobooth4u-kiosk-ipad.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/photobooth4u-kiosk-ipad.ipa
          make_latest: false

