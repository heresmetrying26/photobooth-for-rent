# Builds the standalone Roving DSLR Bridge Android APK:
# A dedicated lightweight companion app for roving photographers wired to a DSLR via USB OTG.
# Patched in this CI checkout only (android/scripts/make-roving-variant.mjs).
# Run it from the Actions tab ("Roving DSLR Bridge Android app" -> Run workflow),
# or push a tag like roving-v1.0.0 to attach the APK to a GitHub release and Netlify CDN.
name: Roving DSLR Bridge Android app

on:
  workflow_dispatch:
  push:
    tags: ['roving-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        id: setup-gradle
        continue-on-error: true      # services.gradle.org / cache service sometimes 504; mirror is used below
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Setup Gradle (fallback download)
        if: steps.setup-gradle.outcome != 'success'
        working-directory: .
        run: |
          echo "::warning::Gradle setup action failed; downloading Gradle 8.5 from GitHub's gradle-distributions instead"
          curl -fL --retry 6 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/gradle-8.5-bin.zip" \
            https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.5-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.5/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.5/bin/gradle" --version
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Bundle latest booth page into assets
        working-directory: .
        run: |
          mkdir -p android/app/src/main/assets
          cp protected/booth.html android/app/src/main/assets/booth.html
      - name: Generate launcher icons from source
        working-directory: .
        run: |
          pip install Pillow --quiet
          python android/scripts/gen_icons.py android/resources/icon_source.png
      - name: Make the Roving DSLR Bridge variant (own app id, dedicated bridge activity)
        working-directory: .
        env:
          ROVING_VERSION_CODE: ${{ github.run_number }}
          ROVING_VERSION_NAME: ${{ github.ref_name }}
        run: node android/scripts/make-roving-variant.mjs
      - name: Load the signing key (when the secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/photobooth4u.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/photobooth4u.keystore" >> "$GITHUB_ENV"
            echo "Signing with the fixed release key"
          else
            echo "No signing secrets: using a throwaway debug key"
          fi
      - name: Check the signing key
        if: env.ANDROID_KEYSTORE_FILE != ''
        env:
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          f="$ANDROID_KEYSTORE_FILE"
          [ -z "$KS_PW" ] && { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is empty or missing"; exit 1; }
          [ -z "$KS_ALIAS" ] && { echo "::error::Secret ANDROID_KEY_ALIAS is empty or missing"; exit 1; }
          [ -z "$KEY_PW" ] && { echo "::error::Secret ANDROID_KEY_PASSWORD is empty or missing"; exit 1; }
          echo "::notice::Keystore file: $(stat -c %s "$f") bytes, sha256 $(sha256sum "$f" | cut -c1-16); password length ${#KS_PW}"
          if ! keytool -list -keystore "$f" -storepass "$KS_PW" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Cannot open keystore: ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD invalid"; exit 1
          fi
          aliases=$(grep -E ', PrivateKeyEntry' "$RUNNER_TEMP/ks.txt" | cut -d, -f1 | tr -s '[:space:]' ' ')
          echo "$aliases" | grep -qw -- "$KS_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS does not match. Found: $aliases"; exit 1; }
          [ "$KEY_PW" = "$KS_PW" ] || { echo "::error::ANDROID_KEY_PASSWORD must match ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          echo "::notice::Signing key OK (alias $KS_ALIAS)"
      - name: Build Debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            errs=$(grep -E '(e: .*|error: .*|FAILURE: .*)' build.log | head -n 10 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::${errs:-$(tail -n 30 build.log | tr '\n' ' ')}"
            exit 1
          }
      - name: Stage APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/roving-dslr-bridge-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roving-dslr-bridge-apk
          path: android/dist/roving-dslr-bridge-android.apk
      - if: startsWith(github.ref, 'refs/tags/roving-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/dist/roving-dslr-bridge-android.apk
          make_latest: false
      - if: startsWith(github.ref, 'refs/tags/roving-v')
        name: Deploy APK to Netlify CDN
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p public/downloads
          cp android/dist/roving-dslr-bridge-android.apk public/downloads/roving-dslr-bridge-android.apk
          git add public/downloads/roving-dslr-bridge-android.apk
          git commit -m "Deploy Roving DSLR Bridge ${{ github.ref_name }} APK to Netlify CDN" || echo "No changes to commit"
          git push origin main
