plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photobooth4u.booth'
    compileSdk 34

    defaultConfig {
        applicationId "com.photobooth4u.booth"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def boothHtml = file("${rootProject.projectDir}/../protected/booth.html")
tasks.register('bundleBoothHtml', Copy) {
    description = 'Copy latest booth.html into APK assets for offline kiosk'
    from boothHtml
    into 'src/main/assets'
    onlyIf { boothHtml.exists() }
}
preBuild.dependsOn bundleBoothHtml

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
}
