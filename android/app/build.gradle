plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photobooth4u.booth'
    compileSdk 34

    defaultConfig {
        applicationId "com.photobooth4u.booth"
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName "1.0.24"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Every release is signed with the same key, so a new APK installs over the old app (and keeps its
    // activation and photos). The key comes from GitHub secrets in CI; without them (local builds) the
    // normal debug key is used.
    def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
    if (keystorePath && file(keystorePath).exists()) {
        signingConfigs {
            photobooth {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            if (signingConfigs.findByName('photobooth')) signingConfig signingConfigs.photobooth
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def boothHtml = file("${rootProject.projectDir}/../protected/booth.html")
tasks.register('bundleBoothHtml', Copy) {
    description = 'Copy latest booth.html into APK assets for offline kiosk'
    from boothHtml
    into 'src/main/assets'
    onlyIf { boothHtml.exists() }
}
preBuild.dependsOn bundleBoothHtml

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    // Verifies this tablet's signed rental-code licence (Ed25519; no JCE provider needed below API 33)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
