<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>photobooth4u</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:#F5F1EA;color:#1C1A1E;min-height:100vh}
header{position:relative;padding:22px 16px 6px;text-align:center}.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;color:#1C1A1E;text-decoration:none}
.back-btn{position:absolute;left:16px;top:16px;background:#fff;border:1.5px solid #E4DCCF;border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;color:#1C1A1E;cursor:pointer;display:none;box-shadow:0 1px 4px rgba(60,40,20,.08);text-decoration:none}
.back-btn:active{background:#F5F1EA}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}.mk i{background:#1C1A1E;border-radius:3px}.mk i:nth-child(2){background:#C93D27}
h1{font-size:24px;line-height:1.2;margin:10px 0 2px;font-weight:800;letter-spacing:-.02em}.sub{color:#6B666C;font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px 12px 40px;max-width:1100px;margin:0 auto}
.grid a{display:block;background:#fff;border-radius:10px;overflow:hidden;aspect-ratio:3/4;box-shadow:0 2px 8px rgba(60,40,20,.08)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.one{max-width:560px;margin:0 auto;padding:6px 16px 40px;text-align:center}.one img,.one video{max-width:100%;max-height:72vh;border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(60,40,20,.15)}
@media print{@page{margin:0}html,body{width:100%;height:100%;margin:0!important;background:#fff!important}body *{visibility:hidden!important}.one{position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;max-width:none!important;margin:0!important;padding:0!important}.one img{position:absolute!important;visibility:visible!important;display:block!important;max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;object-fit:contain!important;border:0!important;border-radius:0!important;box-shadow:none!important}.one h1,.one .sub,.one video,.one div,.one .tip{display:none!important}}
.btn{display:inline-block;margin:16px 6px 0;padding:14px 22px;border-radius:12px;background:#C93D27;color:#fff;font-weight:800;text-decoration:none;font-size:15px}
.btn.alt{background:#fff;color:#1C1A1E;border:1.5px solid #E4DCCF}.tip{color:#6B666C;font-size:13px;line-height:1.5;margin:14px auto 0;max-width:420px}.empty{text-align:center;color:#6B666C;padding:40px 16px}
.tabs{display:inline-flex;background:#EAE4D9;border-radius:24px;padding:3px;margin:0 auto 16px;gap:2px}
.tab{background:transparent;border:0;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:#6B666C;cursor:pointer}
.tab.active{background:#fff;color:#1C1A1E;box-shadow:0 1px 4px rgba(60,40,20,.1)}
.grid.filter-photo > [data-kind]:not([data-kind="photo"]){display:none!important}
.grid.filter-solo > [data-kind]:not([data-kind="solo"]){display:none!important}
.grid.filter-gif > [data-kind]:not([data-kind="gif"]){display:none!important}
.grid.filter-video > [data-kind]:not([data-kind="video"]){display:none!important}
.grid.filter-guestbook > [data-kind]:not([data-kind="guestbook"]){display:none!important}
.grid [data-kind="guestbook"]::after{content:'MESSAGE';position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;letter-spacing:.5px;pointer-events:none}
.grid a{position:relative}
.grid [data-kind="gif"]::after{content:'GIF';position:absolute;bottom:6px;right:6px;background:rgba(28,26,30,.8);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;letter-spacing:.5px;pointer-events:none}
.grid [data-kind="solo"]::after{content:'SOLO';position:absolute;bottom:6px;right:6px;background:rgba(201,61,39,.85);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;letter-spacing:.5px;pointer-events:none}
.grid [data-kind="video"]::after{content:'▶ 360';position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.75);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;letter-spacing:.5px;pointer-events:none}</style>
</head>
<body>
<header>
  <button type="button" class="back-btn" id="backToBooth" aria-label="Back to booth">← Back to booth</button>
  <span class="brand"><span class="mk"><i></i><i></i><i></i><i></i></span>photobooth4u</span>
</header>
<div id="app"><p class="empty">Loading&hellip;</p></div>
<script>
function gbSave(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
}
var gbCRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function gbCrc(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = gbCRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function gbBuildZip(entries) {
  var parts = [], central = [], offset = 0, enc = new TextEncoder();
  var d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  entries.forEach(function (e) {
    var name = enc.encode(e.name), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, e.crc, true);
    h.setUint32(18, e.size, true); h.setUint32(22, e.size, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, e.blob);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, e.crc, true); c.setUint32(20, e.size, true); c.setUint32(24, e.size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(c.buffer, name);
    offset += 30 + name.length + e.size;
  });
  var cdSize = central.reduce(function (n, b) { return n + (b.byteLength || b.length); }, 0);
  var end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
}
// items: [{ name, url }]. A few videos per zip (they are big); the button shows the progress.
var gbBusy = false;
async function gbDownloadAll(items, btn, base) {
  if (gbBusy || !items.length) return;
  gbBusy = true;
  var label = btn.textContent, chunkSize = 3, parts = Math.ceil(items.length / chunkSize), failed = 0;
  btn.disabled = true;
  try {
    for (var p = 0; p < parts; p++) {
      var chunk = items.slice(p * chunkSize, (p + 1) * chunkSize), entries = [];
      for (var i = 0; i < chunk.length; i++) {
        btn.textContent = 'Preparing ' + (p * chunkSize + i + 1) + ' of ' + items.length + '...';
        try {
          var r = await fetch(chunk[i].url); if (!r.ok) throw new Error('HTTP ' + r.status);
          var blob = await r.blob(), u8 = new Uint8Array(await blob.arrayBuffer());
          entries.push({ name: chunk[i].name, blob: blob, size: u8.length, crc: gbCrc(u8) });
        } catch (e) { failed++; }
      }
      if (entries.length) gbSave(gbBuildZip(entries), base + ' - Guestbook' + (parts > 1 ? ' (part ' + (p + 1) + ' of ' + parts + ')' : '') + '.zip');
      if (p < parts - 1) await new Promise(function (r) { setTimeout(r, 800); });
    }
    btn.textContent = failed ? 'Done (' + failed + ' could not load)' : 'Done';
    setTimeout(function () { btn.textContent = label; }, 4000);
  } finally { btn.disabled = false; gbBusy = false; }
}
</script>
<script>
/* The guests' page for one booth event, served by the tablet itself (LocalShareServer).
   /e/<event>/ shows every photo; /e/<event>/p/<file> shows one photo or GIF with a Save button.
   Same look as the page the Windows / Mac app serves. */
(function(){
  var app = document.getElementById('app');
  var m = /^\/e\/([A-Za-z0-9_-]+)(?:\/p\/([^\/]+))?\/?$/.exec(location.pathname);

  var isLocal = location.hostname === '127.0.0.1' || location.hostname === 'localhost' || /PB4uAndroid/i.test(navigator.userAgent);
  var backBtn = document.getElementById('backToBooth');
  if(backBtn && (isLocal || window.history.length > 1)){
    backBtn.style.display = 'inline-block';
    backBtn.onclick = function(){
      if(window.history.length > 1) {
        window.history.back();
      } else {
        location.href = '/';
      }
    };
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function isGif(n){ return /\.gif$/i.test(n); }
  function isVideo(n){ return /\.(mp4|webm)$/i.test(n); }
  function isSolo(n){ return /_solo_\d+/i.test(n); }
  function isGuestbook(n){ return isVideo(n) && /_guestbook/i.test(n); }
  function kindOf(n){ return isGuestbook(n) ? 'guestbook' : isVideo(n) ? 'video' : isGif(n) ? 'gif' : isSolo(n) ? 'solo' : 'photo'; }
  function showMessage(msg, title){
    document.title = title || 'Not found';
    app.innerHTML = '';
    app.appendChild(el('p', 'empty', msg));
  }

  if(!m){ showMessage('This link isn’t on this booth.'); return; }
  var slug = m[1], file = null;
  if(m[2]){ try{ file = decodeURIComponent(m[2]); }catch(e){ file = ''; } }

  function renderList(d){
    var files = d.files || [], gifs = 0, solos = 0, videos = 0, guestbooks = 0, i;
    for(i = 0; i < files.length; i++){
      if(isGif(files[i].n)) gifs++;
      else if(isSolo(files[i].n)) solos++;
      else if(isGuestbook(files[i].n)) guestbooks++;
      else if(isVideo(files[i].n)) videos++;
    }
    var photos = files.length - gifs - solos - videos - guestbooks;
    document.title = d.name + ' photos';
    app.innerHTML = '';

    var head = el('div');
    head.style.cssText = 'text-align:center;padding:0 16px';
    head.appendChild(el('h1', null, d.name));
    var countParts = [];
    if(photos > 0) countParts.push(photos + (solos > 0 ? ' print' : ' photo') + (photos === 1 ? '' : 's'));
    if(solos > 0) countParts.push(solos + ' solo photo' + (solos === 1 ? '' : 's'));
    if(gifs > 0) countParts.push(gifs + ' GIF' + (gifs === 1 ? '' : 's'));
    if(videos > 0) countParts.push(videos + ' video' + (videos === 1 ? '' : 's'));
    if(guestbooks > 0) countParts.push(guestbooks + ' guestbook message' + (guestbooks === 1 ? '' : 's'));
    var count = countParts.join(' · ') || (files.length + ' photo' + (files.length === 1 ? '' : 's'));
    head.appendChild(el('p', 'sub', count + ' · tap one to save it'));
    app.appendChild(head);

    if(!files.length){
      app.appendChild(el('p', 'empty', 'No photos yet. Pull down to refresh after your session.'));
      return;
    }

    var grid = el('div', 'grid');
    var kindsCount = (photos > 0 ? 1 : 0) + (solos > 0 ? 1 : 0) + (gifs > 0 ? 1 : 0) + (videos > 0 ? 1 : 0) + (guestbooks > 0 ? 1 : 0);
    if(kindsCount > 1){
      var holder = el('div'); holder.style.textAlign = 'center';
      var tabs = el('div', 'tabs');
      var defs = [['all', 'All (' + files.length + ')']];
      if(photos > 0) defs.push(['photo', (solos > 0 ? 'Prints (' : 'Photos (') + photos + ')']);
      if(solos > 0) defs.push(['solo', 'Solo Photos (' + solos + ')']);
      if(gifs > 0) defs.push(['gif', 'GIFs (' + gifs + ')']);
      if(videos > 0) defs.push(['video', 'Videos (' + videos + ')']);
      if(guestbooks > 0) defs.push(['guestbook', 'Guestbook (' + guestbooks + ')']);
      var gbBtn = null;
      defs.forEach(function(def, idx){
        var b = el('button', 'tab' + (idx === 0 ? ' active' : ''), def[1]);
        b.type = 'button';
        b.onclick = function(){
          var all = tabs.querySelectorAll('.tab');
          for(var k = 0; k < all.length; k++) all[k].classList.remove('active');
          b.classList.add('active');
          grid.className = 'grid' + (def[0] === 'all' ? '' : ' filter-' + def[0]);
          if(gbBtn) gbBtn.style.display = def[0] === 'guestbook' ? '' : 'none';
        };
        tabs.appendChild(b);
      });
      holder.appendChild(tabs);
      if(guestbooks > 0){
        gbBtn = el('button', 'btn', 'Download all guestbook videos'); gbBtn.type = 'button'; gbBtn.style.cssText = 'display:none;margin:0 auto 14px';
        var gbItems = files.filter(function(f){ return isGuestbook(f.n); }).map(function(f){ return { name: f.n, url: '/e/' + slug + '/f/' + encodeURIComponent(f.n) }; });
        gbBtn.onclick = function(){ gbDownloadAll(gbItems, gbBtn, String(d.name || 'gallery').replace(/[\\\/:*?"<>|]+/g, '_')); };
        holder.appendChild(gbBtn);
      }
      app.appendChild(holder);
    }
    files.forEach(function(f){
      var a = el('a');
      a.href = '/e/' + slug + '/p/' + encodeURIComponent(f.n);
      var k = kindOf(f.n);
      a.setAttribute('data-kind', k);
      if(k === 'video' || k === 'guestbook'){
        var vid = el('video');
        vid.preload = 'metadata'; vid.muted = true;
        vid.setAttribute('playsinline', '');
        vid.src = '/e/' + slug + '/f/' + encodeURIComponent(f.n) + '#t=0.1';
        a.appendChild(vid);
      } else {
        var img = el('img');
        img.loading = 'lazy'; img.alt = '';
        img.src = '/e/' + slug + '/t/' + encodeURIComponent(f.n);
        a.appendChild(img);
      }
      grid.appendChild(a);
    });
    app.appendChild(grid);
  }

  function renderOne(d, name){
    var found = false, i;
    for(i = 0; i < (d.files || []).length; i++) if(d.files[i].n === name) found = true;
    var wrap = el('div', 'one');
    app.innerHTML = '';
    var all = el('a', 'btn alt', 'All photos');
    all.href = '/e/' + slug + '/';
    if(!found){
      document.title = 'Not ready';
      wrap.appendChild(el('p', 'empty', 'This photo isn’t here yet. Wait a moment and refresh.'));
      wrap.appendChild(all);
      app.appendChild(wrap);
      return;
    }
    var gif = isGif(name), vid = isVideo(name), solo = isSolo(name);
    var title = vid ? (isGuestbook(name) ? 'Your message' : 'Your video') : gif ? 'Your GIF' : solo ? 'Solo photo' : 'Your photo';
    document.title = title;
    wrap.appendChild(el('h1', null, title));
    wrap.appendChild(el('p', 'sub', d.name));
    var src = '/e/' + slug + '/f/' + encodeURIComponent(name);

    function track(act){
      try {
        var x = new XMLHttpRequest();
        x.open('POST', '/e/' + slug + '/track');
        x.setRequestHeader('content-type', 'application/json');
        x.send(JSON.stringify({ action: act, file: name }));
      } catch(e){}
    }
    track('views');

    var media;
    if(vid){
      media = el('video');
      media.src = src; media.controls = true; media.autoplay = true; media.muted = true; media.loop = true;
      media.setAttribute('playsinline', '');
    } else {
      media = el('img');
      media.alt = title; media.src = src;
    }
    wrap.appendChild(media);
    var row = el('div');

    if(navigator.share && window.isSecureContext){
      var sh = el('button', 'btn', 'Share / AirDrop ↗');
      sh.type = 'button';
      sh.onclick = function(){
        navigator.share({ title: title + ' - ' + d.name, url: location.href }).then(function(){ track('share'); }).catch(function(){});
      };
      row.appendChild(sh);
    }

    var dl = el('a', 'btn' + (navigator.share && window.isSecureContext ? ' alt' : ''), vid ? 'Save video' : gif ? 'Save GIF' : solo ? 'Save solo photo' : 'Save photo');
    dl.href = src + '?dl=1'; dl.setAttribute('download', name);
    dl.onclick = function(){ track('downloads'); };
    row.appendChild(dl);

    var cp = el('button', 'btn alt', 'Copy link 📋');
    cp.type = 'button';
    cp.onclick = function(){
      var u = location.href.split('?')[0];
      function done(){ cp.textContent = 'Copied ✓'; track('share'); setTimeout(function(){ cp.textContent = 'Copy link 📋'; }, 2500); }
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done).catch(fb);
      else fb();
      function fb(){
        var ta = document.createElement('textarea'); ta.value = u; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta);
      }
    };
    row.appendChild(cp);

    if(!vid && !gif){
      var pr = el('button', 'btn alt', 'Print photo');
      pr.type = 'button';
      pr.onclick = function(){ window.print(); };
      row.appendChild(pr);
    }
    if(!vid && !gif && d.print){
      var ask = el('button', 'btn alt', 'Ask for a print at the booth');
      ask.type = 'button';
      var askKey = 'pb_asked_' + slug + '_' + name;
      try{ if(sessionStorage.getItem(askKey)){ ask.disabled = true; ask.textContent = 'Requested ✓'; } }catch(e){}
      ask.onclick = function(){
        ask.disabled = true; ask.textContent = 'Sending…';
        var x = new XMLHttpRequest();
        x.open('POST', '/e/' + slug + '/print/' + encodeURIComponent(name));
        x.onload = function(){
          var j = null; try{ j = JSON.parse(x.responseText); }catch(e){}
          if(j && j.ok){ try{ sessionStorage.setItem(askKey, '1'); }catch(e){} ask.textContent = j.done ? 'Already printed ✓' : 'Requested ✓'; }
          else { ask.disabled = false; ask.textContent = (j && j.error === 'rate') ? 'Please wait a little, then try again' : (j && j.error === 'off') ? 'Print requests are off' : 'Could not send. Try again'; }
        };
        x.onerror = function(){ ask.disabled = false; ask.textContent = 'Could not send. Try again'; };
        x.send();
      };
      row.appendChild(ask);
    }
    row.appendChild(all);
    wrap.appendChild(row);
    var tip = el('p', 'tip');
    var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    if(isIos) tip.innerHTML = '<b>How to save on iPhone:</b><br>1. Tap <b>Save video</b>.<br>2. Tap the blue download arrow ⬇️ in Safari’s address bar, then tap the clip.<br>3. Tap Share &gt; <b>Save Video</b> to keep it in Photos.';
    else if(isAndroid) tip.innerHTML = '<b>How to save on Android:</b><br>Tap <b>Save video</b>. It downloads directly to your device and appears in Google Photos / Gallery.';
    else tip.innerHTML = 'Tap <b>Save video</b> to download directly to your device.';
    wrap.appendChild(tip);
    app.appendChild(wrap);
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/e/' + slug + '/list.json?t=' + Date.now());
  xhr.timeout = 10000;
  xhr.ontimeout = function(){
    showMessage('Connection timed out. Pull down to refresh or check connection to the booth.', 'Photos');
  };
  xhr.onload = function(){
    if(xhr.status === 404){ showMessage('This event isn’t on this booth anymore.'); return; }
    var data = null;
    try{ data = JSON.parse(xhr.responseText); }catch(e){}
    if(xhr.status !== 200 || !data){ showMessage('Couldn’t load the photos. Pull down to refresh.', 'Photos'); return; }
    if(file === null) renderList(data); else renderOne(data, file);
  };
  xhr.onerror = function(){ showMessage('Couldn’t reach the booth. Check your connection to the booth Wi-Fi.', 'Photos'); };
  xhr.send();
})();
</script>
</body>
</html>
