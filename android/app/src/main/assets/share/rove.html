<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send photos</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F6F1EA;color:#1C1A1E;padding:24px 18px;text-align:center}h1{font-size:22px;margin:6px 0}p{color:#6B666C;margin:6px 0}
.st{font-size:13px;font-weight:700;margin:8px 0}.st.ok{color:#2EA66B}.st.bad{color:#C93D27}
label.pick{display:block;max-width:360px;margin:14px auto 0;padding:18px 26px;border-radius:14px;background:#C93D27;color:#fff;font-weight:800;font-size:18px}label.alt{background:#1C1A1E}input{display:none}
.bar{height:10px;border-radius:6px;background:#E4DCCF;overflow:hidden;margin:6px auto 2px;max-width:420px}.bar i{display:block;height:100%;width:0;background:#2EA66B}.row{margin:14px auto 0;max-width:420px;text-align:left;font-size:14px}#list{margin-top:18px}</style></head><body>
<h1>Send photos to the booth</h1><p>Each photo goes straight to the booth, or queues offline and auto-sends once reconnected.</p>
<div class="st" id="conn">Checking connection…</div>
<label class="pick" for="cam">Take a photo</label><input id="cam" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<label class="pick alt" for="f">Choose photos</label><input id="f" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="list"></div>
<script>var T=location.pathname.replace(/[/]+$/,"").replace(/[/]photos$/,"");
var q=[],rows={},draining=false,retryT=0,idbP=null;
function qDb(){if(idbP)return idbP;if(!window.indexedDB)return Promise.resolve(null);idbP=new Promise(function(res){try{var req=indexedDB.open("pb4u_tablet_rove_q",1);req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains("q"))req.result.createObjectStore("q",{keyPath:"id"})};req.onsuccess=function(){res(req.result)};req.onerror=function(){res(null)}}catch(e){res(null)}});return idbP}
function qPut(it){return qDb().then(function(db){if(!db)return;return new Promise(function(res){try{var tx=db.transaction("q","readwrite");tx.objectStore("q").put({id:it.id,name:it.name,blob:it.blob,at:it.at});tx.oncomplete=res;tx.onerror=res}catch(e){res()}})})}
function qDel(id){return qDb().then(function(db){if(!db)return;return new Promise(function(res){try{var tx=db.transaction("q","readwrite");tx.objectStore("q").delete(id);tx.oncomplete=res;tx.onerror=res}catch(e){res()}})})}
function qLoadAll(){return qDb().then(function(db){if(!db)return[];return new Promise(function(res){try{var tx=db.transaction("q","readonly"),r=tx.objectStore("q").getAll();r.onsuccess=function(){var a=r.result||[];a.sort(function(x,y){return(x.at||0)-(y.at||0)});res(a)};r.onerror=function(){res([])}}catch(e){res([])}})})}
function setConn(ok){var c=document.getElementById("conn");c.className="st "+(ok?"ok":"bad");c.textContent=ok?("✓ Connected to Booth"+(q.length?" · Uploading "+q.length+" queued…":"")):("No connection — "+q.length+" photo(s) queued to auto-send on Wi-Fi")}
function ping(){fetch(T+"/hello",{cache:"no-store"}).then(function(r){if(r.ok){setConn(true);if(q.length&&!draining)drain()}else setConn(false)}).catch(function(){setConn(false)})}
function mkRow(id,name,msg){if(rows[id])return rows[id];var row=document.createElement("div");row.className="row";row.innerHTML="<b></b><div class=bar><i></i></div><span></span>";row.querySelector("b").textContent=name||"photo";row.querySelector("span").textContent=msg||"Queued…";document.getElementById("list").insertBefore(row,document.getElementById("list").firstChild);rows[id]=row;return row}
function uploadOne(it){return new Promise(function(res){var row=mkRow(it.id,it.name,"Sending…"),bar=row.querySelector("i"),sp=row.querySelector("span"),x=new XMLHttpRequest();x.open("POST",T+"/photo?name="+encodeURIComponent(it.name||"photo.jpg")+"&id="+encodeURIComponent(it.id));x.timeout=25000;x.setRequestHeader("content-type","application/octet-stream");x.setRequestHeader("x-rove-id",it.id);x.upload.onprogress=function(p){if(p.lengthComputable)bar.style.width=Math.round(p.loaded/p.total*100)+"%"};x.onload=function(){if(x.status===200){bar.style.width="100%";sp.textContent="Sent ✓ It is on the booth now.";res("ok")}else if(x.status===413){sp.textContent="Too large (>80 MB).";res("drop")}else{sp.textContent="⏳ Queued — waiting for booth ("+x.status+")…";res("retry")}};x.onerror=x.ontimeout=function(){sp.textContent="⏳ Queued offline — auto-sends when back on Wi-Fi";res("retry")};x.send(it.blob)})}
async function drain(){if(draining||!q.length)return;draining=true;try{while(q.length){var it=q[0],r=await uploadOne(it);if(r==="ok"||r==="drop"){q.shift();await qDel(it.id)}else{setConn(false);clearTimeout(retryT);retryT=setTimeout(drain,2500);break}}if(!q.length)ping()}finally{draining=false}}
function enqueueFile(file){var id="tbl_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),it={id:id,name:file.name||"photo.jpg",blob:file,at:Date.now()};mkRow(id,it.name,"Queued to send…");q.push(it);qPut(it).then(function(){drain()})}
function pick(e){Array.prototype.forEach.call(e.target.files,enqueueFile);e.target.value=""}
document.getElementById("f").addEventListener("change",pick);document.getElementById("cam").addEventListener("change",pick);
window.addEventListener("online",function(){ping();drain()});
qLoadAll().then(function(items){items.forEach(function(it){if(!it||!it.id||!it.blob)return;mkRow(it.id,it.name,"⏳ Restored queued photo — waiting to reconnect…");q.push(it)});if(q.length)drain()});
ping();setInterval(function(){if(!document.hidden)ping()},2500);</script></body></html>
