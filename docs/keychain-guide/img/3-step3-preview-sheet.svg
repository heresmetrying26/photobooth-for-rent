      <text x="58" y="22" fill="#C93D27" font-size="8.5" font-weight="800" text-anchor="middle">LUCAS &amp; EMMA</text>
      <text x="58" y="32" fill="#6B666C" font-size="6.5" font-weight="700" text-anchor="middle">2.5×7.5 IN KEYCHAIN</text>
      <!-- Photos -->
