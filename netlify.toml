[build]
  # Re-bundles protected/booth.html into the server function every deploy,
  # so you only ever edit protected/booth.html.
  command = "node scripts/build-booth.mjs"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/lifetime*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Online gallery: /g/<Drive folder id> shows that folder's photos and GIFs.
[[redirects]]
  from = "/g/*"
  to = "/gallery/index.html"
  status = 200

[[headers]]
  for = "/g/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
