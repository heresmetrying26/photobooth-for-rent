[build]
  # Re-bundles protected/booth.html into the server function every deploy,
  # so you only ever edit protected/booth.html.
  command = "node scripts/build-booth.mjs"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    # The booth runs here (the lock screen writes the app into this page).
    # These two make the page cross-origin isolated, which the USB camera
    # (remote control) mode needs. "credentialless" keeps Google Fonts and
    # other outside files loading normally. Safari ignores it (no USB there).
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/lifetime*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Background swap files (MediaPipe runtime + model). Big, rarely changed:
# let browsers keep them for a week so events don't download them again.
[[headers]]
  for = "/bg/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Cross-Origin-Resource-Policy = "same-origin"

# Laptop print station page
[[headers]]
  for = "/print-station/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Printing guide: short links to /how-to-print-hiti/ and /how-to-print-dnp/
[[redirects]]
  from = "/dnp"
  to = "/how-to-print-dnp/"
  status = 301

[[redirects]]
  from = "/how-to-print"
  to = "/how-to-print-hiti/"
  status = 301

# Lifetime Access FAQ: short links to /faq/
[[redirects]]
  from = "/faqs"
  to = "/faq/"
  status = 301

[[redirects]]
  from = "/how-to-print/*"
  to = "/how-to-print-hiti/"
  status = 301

# Online gallery: /g/<Drive folder id> shows that folder's photos and GIFs.
[[redirects]]
  from = "/g/*"
  to = "/gallery/index.html"
  status = 200

[[headers]]
  for = "/g/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# USB camera test page: the camera library (web-gphoto2) needs a
# cross-origin-isolated page, which only these two headers give.
[[headers]]
  for = "/camera-test/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Voucher ticket sheet (printed from the booth / My Events / Admin)
[[headers]]
  for = "/pay/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
