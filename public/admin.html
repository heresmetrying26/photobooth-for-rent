<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Photo Booth · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3c5165;--dim:#89a4b6;--line:#d6ebf5;--blue:#4f8caf;--soft:#eef8fc;--panel:#fff;}
  *{box-sizing:border-box;}
  body{margin:0;padding:20px 14px 60px;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff,#eaf5fb 55%,#ddeef8);min-height:100vh;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-size:22px;margin:0;color:var(--blue);}
  h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:0 0 12px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(79,140,175,.1);}
  label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 0 4px;}
  input[type=text],input[type=password],input[type=number]{width:100%;padding:11px 12px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:#f4fafd;color:var(--ink);outline:none;}
  input:focus{border-color:var(--blue);background:#fff;}
  .row{display:flex;gap:10px;flex-wrap:wrap;} .row>div{flex:1;min-width:110px;}
  button{font:inherit;font-weight:600;font-size:13.5px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  button.danger{color:#c0392b;border-color:#f0c9c4;}
  button.small{padding:6px 10px;font-size:12px;}
  button:disabled{opacity:.55;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f4166;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:10;}
  .toast.show{opacity:1;} .toast.err{background:#c0392b;}
  .lic{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfdfe;}
  .lic-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;letter-spacing:.5px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;}
  .b-unused{background:#e8f1ff;color:#2f5fa8;} .b-active{background:#e3f6ea;color:#1e8449;}
  .b-expired{background:#f1f1f1;color:#777;} .b-revoked{background:#fde8e6;color:#c0392b;}
  .meta{font-size:12.5px;color:var(--dim);margin:6px 0 10px;line-height:1.5;}
  .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px;}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:14px;}
  .hidden{display:none;}
  .newbox{background:var(--soft);border:1.5px dashed var(--blue);border-radius:12px;padding:12px;margin-top:12px;}
  .newbox .code{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;}
  .printbox{margin-top:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#f9fcfe;}
  .printbox .toggle{margin-bottom:0;font-weight:600;}
  .sizes{margin-top:10px;}
  .sizes .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .sizes.off{display:none;}
  .custom-size{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--dim);font-weight:600;}
  .custom-size input[type=number]{width:72px;padding:6px 8px;font-size:13px;}
  .custom-size select{font:inherit;font-size:13px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:#f4fafd;color:var(--ink);}
  .size-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;margin:0;}
  .size-chip:has(input:checked){border-color:var(--blue);background:var(--soft);}
  .b-print{background:#fff4e0;color:#a2620c;}
  .lic .printbox{margin:0 0 10px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card" style="max-width:380px;margin:12vh auto 0;">
    <h1 style="margin-bottom:14px;">Admin login</h1>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn" style="width:100%;margin-top:12px;">Log in</button>
  </div>

  <div id="adminView" class="hidden">
    <div class="top">
      <h1>Photo Booth · Admin</h1>
      <button id="logoutBtn" class="small">Log out</button>
    </div>

    <div class="card">
      <h2>Create rental codes</h2>
      <div class="row">
        <div style="flex:2;min-width:160px;"><label>Client / event</label><input id="newLabel" type="text" maxlength="80" placeholder="e.g. Sofia's Dedication"></div>
        <div style="flex:2;min-width:160px;"><label>Drive folder name</label><input id="newFolderName" type="text" maxlength="80" placeholder="Defaults to client / event"></div>
        <div><label>Days</label><input id="newDays" type="number" min="1" max="365" value="3"></div>
        <div><label>How many</label><input id="newCount" type="number" min="1" max="20" value="1"></div>
      </div>
      <div class="printbox" id="newPrint"></div>
      <button class="primary" id="createBtn" style="margin-top:12px;">Generate</button>
      <div id="newBox" class="newbox hidden"></div>
      <div class="meta" style="margin-bottom:0;">Each code works once. The days start counting when the renter first enters it.</div>
    </div>

    <div class="card">
      <h2>Trial password</h2>
      <label class="toggle"><input type="checkbox" id="trialEnabled"> Trial enabled</label>
      <div class="row">
        <div style="flex:2;"><label>Trial password (reusable)</label><input id="trialPw" type="text"></div>
        <div><label>Trial minutes</label><input id="trialMin" type="number" min="1" max="240"></div>
      </div>
      <label style="margin-top:10px;">Trial Drive folder name</label>
      <input id="trialFolderPrefix" type="text" maxlength="60">
      <div class="meta" style="margin-bottom:0;">Each trial gets its own folder like "Prefix ABC123", so simultaneous trials never share photos.</div>
      <div class="printbox" id="trialPrint"></div>
      <button class="primary" id="saveTrialBtn" style="margin-top:12px;">Save trial settings</button>
    </div>

    <div class="card">
      <div class="top" style="margin-bottom:10px;"><h2 style="margin:0;">Rental codes</h2><button class="small" id="refreshBtn">Refresh</button></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var TOKEN = sessionStorage.getItem('pb_admin') || '';
  var $ = function(id){ return document.getElementById(id); };
  var DAY = 86400000;
  // Same keys as PAPER_SIZES in netlify/lib/core.mjs.
  var PAPER = [
    ['2x6', '2×6 in strip'], ['3.5x5', '3.5×5 in (3R)'], ['4x6', '4×6 in (4R)'], ['5x7', '5×7 in (5R)'],
    ['6x8', '6×8 in (6R)'], ['8x10', '8×10 in (8R)'],
    ['A6', 'A6'], ['A5', 'A5'], ['A4', 'A4'], ['Letter', 'Letter']
  ];
  var PAPER_NAME = {}; PAPER.forEach(function(p){ PAPER_NAME[p[0]] = p[1]; });
  // Custom sizes: "4x4in" / "100x148mm" (same format the server accepts).
  var CUSTOM_RE = /^(\d{1,3}(?:\.\d{1,2})?)x(\d{1,3}(?:\.\d{1,2})?)(in|mm)$/;
  function paperName(k){
    if(PAPER_NAME[k]) return PAPER_NAME[k];
    var m = CUSTOM_RE.exec(k);
    return m ? m[1] + '×' + m[2] + ' ' + m[3] + ' (custom)' : k;
  }
  var DEFAULT_SIZES = ['2x6', '4x6'];

  // Printing on/off + allowed paper sizes, used for new codes, each existing
  // code and the trial. Sizes are hidden while printing is off.
  function printPicker(box, print, title){
    print = print || { enabled: false, sizes: DEFAULT_SIZES };
    var sizes = print.sizes && print.sizes.length ? print.sizes : DEFAULT_SIZES;
    var chip = function(key, on){
      return '<label class="size-chip"><input type="checkbox" class="pp-size" value="' + esc(key) + '"' + (on ? ' checked' : '') + '>' + esc(paperName(key)) + '</label>';
    };
    var customs = sizes.filter(function(k){ return !PAPER_NAME[k]; });
    box.innerHTML = '<label class="toggle"><input type="checkbox" class="pp-on"' + (print.enabled ? ' checked' : '') + '> ' + esc(title) + '</label>' +
      '<div class="sizes' + (print.enabled ? '' : ' off') + '">' +
        '<div class="chips">' + PAPER.map(function(p){ return chip(p[0], sizes.indexOf(p[0]) >= 0); }).join('') +
          customs.map(function(k){ return chip(k, true); }).join('') + '</div>' +
        '<div class="custom-size">' +
          '<span>Custom size</span>' +
          '<input type="number" class="cs-w" min="1" step="0.1" placeholder="W">' +
          '<span>×</span>' +
          '<input type="number" class="cs-h" min="1" step="0.1" placeholder="H">' +
          '<select class="cs-u"><option value="in">in</option><option value="mm">mm</option></select>' +
          '<button type="button" class="small cs-add">Add size</button>' +
        '</div>' +
      '</div>';
    box.querySelector('.pp-on').addEventListener('change', function(){
      box.querySelector('.sizes').classList.toggle('off', !this.checked);
    });
    box.querySelector('.cs-add').addEventListener('click', function(){
      var w = Number(box.querySelector('.cs-w').value), h = Number(box.querySelector('.cs-h').value);
      var u = box.querySelector('.cs-u').value;
      var lo = u === 'in' ? 1 : 25, hi = u === 'in' ? 20 : 500;
      if(!(w >= lo && w <= hi && h >= lo && h <= hi)){
        toast('Custom size must be ' + lo + '–' + hi + ' ' + u + ' on each side.', true); return;
      }
      var key = (Math.round(w * 100) / 100) + 'x' + (Math.round(h * 100) / 100) + u;
      var existing = box.querySelector('.pp-size[value="' + key + '"]');
      if(existing){ existing.checked = true; return; }
      if(box.querySelectorAll('.pp-size').length - PAPER.length >= 6){ toast('Up to 6 custom sizes.', true); return; }
      box.querySelector('.chips').insertAdjacentHTML('beforeend', chip(key, true));
      box.querySelector('.cs-w').value = ''; box.querySelector('.cs-h').value = '';
    });
  }
  function readPrint(box){
    return {
      enabled: box.querySelector('.pp-on').checked,
      sizes: [].slice.call(box.querySelectorAll('.pp-size:checked')).map(function(i){ return i.value; })
    };
  }
  function printSummary(p){
    if(!p || !p.enabled || !p.sizes || !p.sizes.length) return 'Printing: off';
    return 'Printing: <b>' + p.sizes.map(function(k){ return esc(paperName(k)); }).join(', ') + '</b>';
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var tt;
  function toast(text, err){
    var t = $('toast'); t.textContent = text; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(tt); tt = setTimeout(function(){ t.className = 'toast'; }, 2800);
  }

  async function api(body){
    var r = await fetch('/api/admin', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify(body)
    });
    var j = await r.json().catch(function(){ return {}; });
    if(r.status === 401 && body.action !== 'login'){ logout(); toast('Session expired — please log in again.', true); throw new Error('auth'); }
    if(!r.ok) throw new Error(j.error || 'Request failed');
    return j;
  }

  function showAdmin(on){
    $('loginView').classList.toggle('hidden', on);
    $('adminView').classList.toggle('hidden', !on);
  }
  function logout(){ TOKEN = ''; sessionStorage.removeItem('pb_admin'); showAdmin(false); }

  $('loginBtn').addEventListener('click', login);
  $('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });
  async function login(){
    $('loginBtn').disabled = true;
    try{
      var j = await api({ action: 'login', password: $('pw').value });
      TOKEN = j.token; sessionStorage.setItem('pb_admin', TOKEN);
      $('pw').value = '';
      showAdmin(true); await load();
    }catch(e){ if(e.message !== 'auth') toast(e.message, true); }
    $('loginBtn').disabled = false;
  }
  $('logoutBtn').addEventListener('click', logout);
  $('refreshBtn').addEventListener('click', function(){ load().then(function(){ toast('Refreshed'); }); });

  function statusOf(l, now){
    if(l.status === 'active' && l.expiresAt <= now) return 'expired';
    return l.status;
  }
  function fmtLeft(ms){
    if(ms <= 0) return '0m';
    var d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / 3600000), m = Math.floor(ms % 3600000 / 60000);
    return d ? d + 'd ' + h + 'h' : (h ? h + 'h ' + m + 'm' : m + 'm');
  }
  function fmtDate(t){ return new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }

  async function load(){
    try{
      var j = await api({ action: 'list' });
      renderSettings(j.settings);
      renderList(j.licenses, j.now);
    }catch(e){ if(e.message !== 'auth') toast(e.message, true); }
  }

  function renderSettings(s){
    $('trialEnabled').checked = !!s.trialEnabled;
    $('trialPw').value = s.trialPassword;
    $('trialMin').value = s.trialMinutes;
    $('trialFolderPrefix').value = s.trialFolderPrefix;
    printPicker($('trialPrint'), { enabled: s.trialPrintEnabled, sizes: s.trialPrintSizes }, 'Allow printing during trials');
  }

  var LIC = {};
  function renderList(rows, now){
    var el = $('list');
    if(!rows.length){ el.innerHTML = '<div class="empty">No codes yet. Generate one above.</div>'; return; }
    LIC = {}; rows.forEach(function(l){ LIC[l.code] = l; });
    el.innerHTML = rows.map(function(l){
      var st = statusOf(l, now), info = '';
      if(st === 'unused') info = l.days + ' day' + (l.days === 1 ? '' : 's') + ' · not redeemed yet';
      else if(st === 'active') info = 'Redeemed ' + fmtDate(l.redeemedAt) + ' · ends ' + fmtDate(l.expiresAt) + ' (' + fmtLeft(l.expiresAt - now) + ' left)' + (l.deviceId ? '' : ' · <b>waiting for a new device</b>');
      else if(st === 'expired') info = 'Ended ' + fmtDate(l.expiresAt);
      else info = 'Disabled';
      var acts = '';
      if(st === 'active') acts += '<button class="small" data-a="unbind" data-c="' + esc(l.code) + '">Allow new device</button>';
      if(st !== 'revoked') acts += '<button class="small" data-a="extend" data-c="' + esc(l.code) + '">+ Add days</button>';
      acts += '<button class="small" data-a="printedit" data-c="' + esc(l.code) + '">Print settings</button>';
      acts += st === 'revoked'
        ? '<button class="small" data-a="restore" data-c="' + esc(l.code) + '">Restore</button>'
        : '<button class="small danger" data-a="revoke" data-c="' + esc(l.code) + '">Disable</button>';
      acts += '<button class="small danger" data-a="delete" data-c="' + esc(l.code) + '">Delete</button>';
      var printOn = l.print && l.print.enabled;
      return '<div class="lic" data-code="' + esc(l.code) + '"><div class="lic-head"><span class="code">' + esc(l.code) + '</span><span>' + (printOn ? '<span class="badge b-print">print</span> ' : '') + '<span class="badge b-' + st + '">' + st + '</span></span></div>' +
        '<div class="meta">' + (l.label ? '<b>' + esc(l.label) + '</b><br>' : '') + 'Drive folder: <b>' + esc(l.folderName || l.label || l.code) + '</b><br>' + printSummary(l.print) + '<br>' + info + '</div>' +
        '<div class="printbox hidden" data-print-edit></div>' +
        '<div class="actions"><button class="small" data-a="copy" data-c="' + esc(l.code) + '">Copy</button>' + acts + '</div></div>';
    }).join('');
  }

  $('list').addEventListener('click', async function(e){
    var b = e.target.closest('button[data-a]'); if(!b) return;
    var a = b.dataset.a, code = b.dataset.c;
    try{
      if(a === 'copy'){ await navigator.clipboard.writeText(code); toast('Copied ' + code); return; }
      if(a === 'printedit'){
        var box = b.closest('.lic').querySelector('[data-print-edit]');
        if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
        printPicker(box, LIC[code] && LIC[code].print, 'Allow printing for this rental');
        box.insertAdjacentHTML('beforeend', '<div class="actions" style="margin-top:10px;"><button class="small primary" data-a="printsave" data-c="' + esc(code) + '">Save print settings</button></div>');
        box.classList.remove('hidden');
        return;
      }
      if(a === 'printsave'){
        var pb = readPrint(b.closest('[data-print-edit]'));
        await api({ action: 'print', code: code, printEnabled: pb.enabled, printSizes: pb.sizes });
        toast('Print settings saved — an open booth picks them up within ~5 minutes');
        load();
        return;
      }
      if(a === 'delete' && !confirm('Delete ' + code + ' permanently? If it is active, the renter is locked out.')) return;
      if(a === 'revoke' && !confirm('Disable ' + code + '? The renter is locked out at their next check (within ~5 minutes).')) return;
      var body = { action: a, code: code };
      if(a === 'extend'){
        var d = prompt('Add how many days?', '1'); if(!d) return;
        body.days = d;
      }
      await api(body);
      toast('Done'); load();
    }catch(err){ if(err.message !== 'auth') toast(err.message, true); }
  });

  $('createBtn').addEventListener('click', async function(){
    var btn = this; btn.disabled = true;
    try{
      var np = readPrint($('newPrint'));
      var j = await api({ action: 'create', label: $('newLabel').value, folderName: $('newFolderName').value, days: $('newDays').value, count: $('newCount').value, printEnabled: np.enabled, printSizes: np.sizes });
      var box = $('newBox');
      box.classList.remove('hidden');
      box.innerHTML = '<b style="font-size:12px;">New code' + (j.created.length > 1 ? 's' : '') + ' — copy and send to the renter</b>' +
        j.created.map(function(l){ return '<div class="code"><span>' + esc(l.code) + '</span><button class="small" data-copy="' + esc(l.code) + '">Copy</button></div>'; }).join('');
      $('newLabel').value = '';
      $('newFolderName').value = '';
      delete $('newFolderName').dataset.edited;
      load();
    }catch(err){ if(err.message !== 'auth') toast(err.message, true); }
    btn.disabled = false;
  });
  $('newLabel').addEventListener('input', function(){
    if(!$('newFolderName').dataset.edited) $('newFolderName').value = this.value;
  });
  $('newFolderName').addEventListener('input', function(){
    this.dataset.edited = this.value ? 'true' : '';
  });
  $('newBox').addEventListener('click', function(e){
    var b = e.target.closest('button[data-copy]'); if(!b) return;
    navigator.clipboard.writeText(b.dataset.copy).then(function(){ toast('Copied'); });
  });

  $('saveTrialBtn').addEventListener('click', async function(){
    try{
      var tp = readPrint($('trialPrint'));
      await api({ action: 'settings', trialEnabled: $('trialEnabled').checked, trialPassword: $('trialPw').value, trialMinutes: $('trialMin').value, trialFolderPrefix: $('trialFolderPrefix').value, trialPrintEnabled: tp.enabled, trialPrintSizes: tp.sizes });
      toast('Trial settings saved');
    }catch(err){ if(err.message !== 'auth') toast(err.message, true); }
  });

  printPicker($('newPrint'), null, 'Allow printing for these codes');
  if(TOKEN){ showAdmin(true); load(); }
})();
</script>
</body>
</html>
