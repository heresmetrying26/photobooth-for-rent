<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>USB Camera Test · photobooth4u</title>
<style>
  :root{ --bg:#f7f3ee; --card:#fff; --ink:#1c1a1e; --dim:#6b6470; --line:#e4ddd3; --blue:#2b5fd9; }
  body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  main{max-width:640px; margin:0 auto; padding:40px 16px;}
  h1{font-size:26px; margin:0 0 6px;} p{color:var(--dim); margin:0 0 20px;}
  .pick{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
  .pick a{display:block; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; color:var(--ink); text-decoration:none;}
  .pick a:hover{border-color:var(--blue);} .pick b{display:block; font-size:17px;} .pick span{color:var(--dim); font-size:14px;}
</style>
</head>
<body>
<main>
  <h1>USB camera test</h1>
  <p>Pick your computer. Taking you to the right one&hellip;</p>
  <div class="pick">
    <a href="mac/"><b>Mac or Android</b><span>Works with no setup in Chrome / Edge</span></a>
    <a href="windows/"><b>Windows</b><span>Nikon, with the photobooth4u Helper</span></a>
  </div>
</main>
<script>
  (function(){
    var ua = navigator.userAgent || '';
    var to = /Windows/i.test(ua) ? 'windows/' : (/Mac|Android/i.test(ua) ? 'mac/' : null);
    if(to) location.replace(to + location.search);
  })();
</script>
</body>
</html>
