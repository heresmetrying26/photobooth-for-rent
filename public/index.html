<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>photobooth4u</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; flex-direction:column;
    font-family:'Manrope',system-ui,sans-serif; color:#1C1A1E;
    background:#F5F1EA;
  }
  .card{
    width:100%; max-width:400px; background:#fff; border:1px solid #E4DCCF; border-radius:20px;
    padding:32px 24px 24px; text-align:center; box-shadow:0 18px 40px rgba(60,40,20,0.10);
  }
  .mark{display:grid; grid-template-columns:1fr 1fr; gap:4px; width:36px; height:36px; margin:0 auto 16px;}
  .mark i{background:#1C1A1E; border-radius:4px;} .mark i:nth-child(2){background:#C93D27;}
  h1{display:flex; justify-content:center; align-items:flex-start; margin:0; color:#1C1A1E;}
  h1 b{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:38px; letter-spacing:-0.035em; line-height:1;}
  h1 em{font-style:normal; margin-left:5px; padding:3px 8px 5px; border-radius:9px; background:#C93D27; color:#fff; font-weight:800; font-size:17px; line-height:1; transform:rotate(-7deg);}
  .sub{font-size:11px; font-weight:700; letter-spacing:0.24em; text-transform:uppercase; color:#6B666C; margin:12px 0 22px;}
  input{
    width:100%; padding:14px; font-size:16px; text-align:center; letter-spacing:1px;
    border:1.5px solid #E4DCCF; border-radius:12px; background:#FAF7F2; color:#1C1A1E; outline:none;
    font-family:inherit;
  }
  input:focus{border-color:#C93D27; background:#fff;}
  button{
    width:100%; margin-top:12px; padding:14px; font-size:15px; font-weight:700; font-family:inherit;
    background:#C93D27; color:#fff; border:none; border-radius:12px; cursor:pointer; letter-spacing:0.08em;
  }
  button:disabled{opacity:.6; cursor:default;}
  .msg{margin-top:14px; font-size:13.5px; line-height:1.45; min-height:20px;}
  .msg.error{color:#c0392b;} .msg.warn{color:#b9770e;} .msg.ok{color:#1e8449;}
  .hint{margin-top:16px; font-size:12px; color:#6B666C; line-height:1.5;}
  .busy{display:none;}
  body.loading .form{display:none;} body.loading .busy{display:block;}
  .spinner{width:26px;height:26px;margin:6px auto 10px;border:3px solid #F2D9D2;border-top-color:#C93D27;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* top navigation */
  .topnav{display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; width:min(980px,calc(100% - 32px)); margin:0 auto; padding:18px 0;}
  .nbrand{display:flex; align-items:center; gap:9px; text-decoration:none; color:#1C1A1E;}
  .nmark{display:grid; grid-template-columns:1fr 1fr; gap:3px; width:24px; height:24px; flex:none;}
  .nmark i{background:#1C1A1E; border-radius:4px;} .nmark i:nth-child(2){background:#C93D27;}
  .nword{display:flex; align-items:flex-start;}
  .nword b{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:23px; letter-spacing:-0.035em; line-height:1;}
  .nword em{font-style:normal; margin-left:3px; padding:2px 6px 4px; border-radius:7px; background:#C93D27; color:#fff; font-weight:800; font-size:11px; line-height:1; transform:rotate(-7deg);}
  .navlinks{display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
  .navlinks a{font-size:14px; font-weight:700; color:#6B666C; text-decoration:none; padding:9px 13px; border-radius:999px; white-space:nowrap; transition:background .2s,color .2s;}
  .navlinks a:hover,.navlinks a:focus-visible{color:#1C1A1E; background:#fff; outline:none;}
  .navlinks a.cta{margin-left:4px; color:#fff; background:#C93D27;}
  .navlinks a.cta:hover,.navlinks a.cta:focus-visible{background:#A9301D; color:#fff;}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:12px 16px 48px;}
  @media (max-width:640px){
    .topnav{justify-content:center; padding:16px 0 4px;}
    .navlinks{width:100%; justify-content:center; gap:2px;}
    .navlinks a{font-size:13.5px; padding:8px 10px;}
    .navlinks a.cta{margin-left:2px;}
    main{align-items:flex-start; padding-top:18px;}
  }
</style>
</head>
<body class="loading">
  <header class="topnav">
    <a class="nbrand" href="/about-us/" aria-label="About photobooth4u"><span class="nmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="nword"><b>photobooth</b><em>4u</em></span></a>
    <nav class="navlinks" aria-label="Main">
      <a href="/about-us/">About us</a>
      <a href="/about-us/#packages">Pricing</a>
      <a href="/lifetime/">My events</a>
      <a class="cta" href="/about-us/#avail">Book now</a>
    </nav>
  </header>

  <main>
  <div class="card">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1><b>photobooth</b><em>4u</em></h1>
    <div class="sub">Enter your access code</div>

    <div class="busy"><div class="spinner"></div><div id="busyText" style="font-size:13.5px;color:#6B666C;">Checking access…</div></div>

    <div class="form">
      <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Password or rental code">
      <button id="unlockBtn">Unlock</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint">Your code stays unlocked on the device you first enter it on.<br>Booked for a date? It opens on your event day.<br>Trying it out? Use the trial password.<br><a href="/lifetime/" style="color:inherit;font-weight:700;">Find your event photos &amp; setup guide →</a></div>
  </div>
  </main>

<script>
(function(){
  var TOKEN_KEY = 'pb_token', DEV_KEY = 'pb_device';
  var MESSAGES = {
    'expired': 'Your rental period has ended. Enter a new code to keep using the photo booth.',
    'trial-ended': 'Your trial has ended. Enter a rental code to keep going.',
    'bonus-ended': 'Your bonus time has ended. Use your event code on the day of your event.',
    'device-removed': 'This device was removed from the code. Enter the code again, or contact the owner.',
    'trial-disabled': 'The trial is no longer available. Please enter a rental code.',
    'revoked': 'This access has been disabled. Please contact the owner.',
    'offline-only': 'This code is for the photobooth4u laptop app (Windows / Mac). Open the app on your laptop and enter the code there.',
    'invalid': 'Please enter your password or rental code to continue.'
  };
  var msg = document.getElementById('msg');
  var codeEl = document.getElementById('code');
  var btn = document.getElementById('unlockBtn');

  function show(text, kind){ msg.textContent = text || ''; msg.className = 'msg ' + (kind || ''); }
  function busy(on, text){
    document.body.classList.toggle('loading', on);
    if(text) document.getElementById('busyText').textContent = text;
  }
  function deviceId(){
    var d = localStorage.getItem(DEV_KEY);
    if(!d){
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (String(Math.random()).slice(2) + Date.now());
      localStorage.setItem(DEV_KEY, d);
    }
    return d;
  }

  // Ask the server for the app. It is only ever sent to a valid license, then
  // written straight into this page.
  async function openApp(token){
    var r;
    try{
      r = await fetch('/api/app', { headers: { 'Authorization': 'Bearer ' + token, 'X-Device-Id': deviceId() }, cache: 'no-store' });
    }catch(e){
      busy(false);
      show("Can't reach the server. Check your internet connection and try again.", 'warn');
      return false;
    }
    if(r.ok){
      var fresh = r.headers.get('x-refreshed-token');
      if(fresh) localStorage.setItem(TOKEN_KEY, fresh);
      var html = await r.text();
      document.open(); document.write(html); document.close();
      return true;
    }
    var j = {};
    try{ j = await r.json(); }catch(e){}
    localStorage.removeItem(TOKEN_KEY);
    busy(false);
    show(MESSAGES[j.reason] || MESSAGES.invalid, 'warn');
    return false;
  }

  async function unlock(){
    var code = codeEl.value.trim();
    if(!code){ show('Please enter your password or code.', 'error'); return; }
    btn.disabled = true; show('');
    try{
      var r = await fetch('/api/redeem', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code: code, deviceId: deviceId(), dk: (function(){ var ua = navigator.userAgent || '', touch = navigator.maxTouchPoints > 1;
          if(/iPad/.test(ua) || (/Macintosh/.test(ua) && touch)) return 'iPad'; if(/iPhone/.test(ua)) return 'iPhone';
          if(/Android/.test(ua)) return /Mobile/.test(ua) ? 'Android phone' : 'Android tablet'; if(/CrOS/.test(ua)) return 'Chromebook';
          if(/Windows/.test(ua)) return 'Windows computer'; if(/Macintosh/.test(ua)) return 'Mac'; return ''; })() })
      });
      var j = await r.json();
      if(!r.ok){ show(j.error || 'Something went wrong. Please try again.', 'error'); btn.disabled = false; return; }
      localStorage.setItem(TOKEN_KEY, j.token);
      var until = function(){ try{ return new Date(j.exp).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }catch(e){ return ''; } };
      var note = j.type === 'trial'
        ? 'Trial unlocked — ' + j.minutes + ' minutes.'
        : j.lifetime
          ? 'Unlocked — lifetime access on this device.'
        : j.kind === 'bonus'
          ? 'Bonus unlocked — ' + j.minutes + ' minutes starts now.'
          : j.scheduled
            ? 'Unlocked — your booth is open until ' + until() + '.'
            : (j.days ? 'Unlocked — ' + j.days + ' day' + (j.days === 1 ? '' : 's') + ' of access starts now.' : 'Welcome back!');
      // Lifetime codes land on their My Events page first (setup guide, past
      // events, and an Open photo booth button). The saved token signs them in there.
      if(j.lifetime){
        show('Welcome! Taking you to your events page…', 'ok');
        setTimeout(function(){ location.href = '/lifetime/?welcome=1'; }, 900);
        return;
      }
      show(note, 'ok');
      setTimeout(function(){ openApp(j.token).then(function(ok){ if(!ok) btn.disabled = false; }); }, 900);
    }catch(e){
      show("Can't reach the server. Check your internet connection and try again.", 'warn');
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', unlock);
  codeEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });

  (async function boot(){
    var notice = null;
    try{ notice = sessionStorage.getItem('pb_notice'); sessionStorage.removeItem('pb_notice'); }catch(e){}
    var token = localStorage.getItem(TOKEN_KEY);
    if(notice){
      busy(false);
      show(MESSAGES[notice] || MESSAGES.invalid, 'warn');
      localStorage.removeItem(TOKEN_KEY);
      return;
    }
    if(token){ busy(true, 'Checking access…'); await openApp(token); }
    else busy(false);
  })();
})();
</script>
</body>
</html>
