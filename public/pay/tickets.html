<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Voucher tickets | photobooth4u</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style id="pageRule">@page{ size:A4; margin:0; }</style>
<style>
  :root{ --ink:#1C1A1E; --muted:#6B666C; --red:#C93D27; --paper:#F5F1EA; --line:#E4DCCF; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Manrope',system-ui,sans-serif;}
  .bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px; background:#fff; border-bottom:1px solid var(--line);}
  .bar h1{margin:0; font:600 20px 'Fraunces',Georgia,serif;}
  .bar p{margin:2px 0 0; font-size:13px; color:var(--muted); font-weight:600;}
  .bar-ctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .segs{display:inline-flex; gap:4px; padding:4px; border-radius:999px; background:#f3ede3; border:1px solid var(--line);}
  .seg{min-height:36px; padding:6px 13px; border-radius:999px; border:0; background:transparent; color:var(--ink); font:700 13px 'Manrope',sans-serif; cursor:pointer;}
  .seg.active{background:#1C1A1E; color:#fff;}
  .cut-chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink); padding:6px 10px; border-radius:999px; background:#faf7f2; border:1px solid var(--line); cursor:pointer; user-select:none;}
  .cut-chk[hidden]{display:none;}
  .cut-chk input{accent-color:var(--red); width:16px; height:16px; margin:0;}
  .btn{min-height:44px; padding:10px 20px; border-radius:999px; border:0; background:var(--red); color:#fff; font:800 15px 'Manrope',sans-serif; cursor:pointer;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---- A4 sheet (10 per page, 2x5) ---- */
  .sheet{width:210mm; min-height:297mm; margin:18px auto; background:#fff; padding:10mm 10mm; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:53.4mm; gap:0; box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .t{position:relative; border:1px dashed #b9b0a3; margin:-0.5px; padding:5mm 6mm; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden;}
  .t .top{display:flex; justify-content:space-between; align-items:flex-start; gap:4mm;}
  .t .ev{font:600 13pt/1.15 'Fraunces',Georgia,serif; max-width:58mm; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .t .kick{font:800 6.5pt 'Manrope',sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);}
  .t .price{font:800 15pt 'Manrope',sans-serif; color:var(--red); white-space:nowrap;}
  .t .code{font:800 24pt 'Manrope',sans-serif; letter-spacing:.08em; font-variant-numeric:tabular-nums; text-align:center; padding:1.5mm 0; border-radius:3mm; background:#f6f1ea;}
  .t .inc{font:700 8pt 'Manrope',sans-serif; text-align:center; margin-top:1mm;}
  .t .how{font:600 6.8pt/1.35 'Manrope',sans-serif; color:var(--muted); text-align:center;}

  /* ---- Thermal receipt rolls (80mm / 58mm, pure high-contrast monochrome) ---- */
  .t-roll{margin:20px auto; background:#fff; color:#000; box-shadow:0 8px 30px rgba(0,0,0,.1); padding:3mm 0;}
  .t-roll.r80{width:72mm;}
  .t-roll.r58{width:48mm;}
  .rt{padding:2.2mm 2.2mm 2.5mm; color:#000; page-break-inside:avoid; break-inside:avoid;}
  .rt-box{border:1.8px solid #000; border-radius:2.5mm; padding:3mm 2.8mm; text-align:center;}
  .rt-kick{font:800 7pt 'Manrope',sans-serif; letter-spacing:.12em; text-transform:uppercase; padding-bottom:1.6mm; border-bottom:1px solid #000;}
  .rt-ev{font:700 12pt/1.15 'Fraunces',Georgia,serif; margin:2.4mm 0 1.6mm; word-break:break-word;}
  .rt-meta{display:flex; justify-content:center; align-items:center; gap:2mm; flex-wrap:wrap; margin-bottom:2.2mm;}
  .rt-price{font:800 14pt 'Manrope',sans-serif;}
  .rt-pill{display:inline-block; background:#000; color:#fff; font:800 7pt 'Manrope',sans-serif; letter-spacing:.06em; padding:0.7mm 2.2mm; border-radius:999px; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .rt-code-wrap{border:2.2px solid #000; border-radius:2mm; padding:1.8mm 1.2mm 2mm; margin:1.6mm 0 2.2mm;}
  .rt-code-lbl{font:800 6pt 'Manrope',sans-serif; letter-spacing:.14em; text-transform:uppercase; margin-bottom:0.8mm;}
  .rt-code{font:800 20pt/1 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; letter-spacing:.06em; font-variant-numeric:tabular-nums;}
  .rt-inc{font:800 8.5pt 'Manrope',sans-serif; margin-bottom:2mm;}
  .rt-how{font:700 7.2pt/1.35 'Manrope',sans-serif; border-top:1px dashed #000; padding-top:1.8mm;}
  .rt-cut{position:relative; margin:3.5mm 1mm 1mm; border-top:1.5px dashed #000; text-align:center; height:0;}
  .rt-cut span{position:relative; top:-2.1mm; background:#fff; padding:0 2mm; font:800 6pt 'Manrope',sans-serif; letter-spacing:.12em;}
  .rt.cut-each{page-break-after:always; break-after:page;}
  .rt.cut-each:last-child{page-break-after:auto; break-after:auto;}

  /* 58mm compact typography */
  .t-roll.r58 .rt{padding:1.6mm 1.4mm 1.8mm;}
  .t-roll.r58 .rt-box{border-width:1.4px; border-radius:2mm; padding:2.2mm 1.8mm;}
  .t-roll.r58 .rt-kick{font-size:5.6pt; letter-spacing:.08em; padding-bottom:1.2mm;}
  .t-roll.r58 .rt-ev{font-size:9.5pt; margin:1.8mm 0 1.2mm;}
  .t-roll.r58 .rt-price{font-size:11pt;}
  .t-roll.r58 .rt-pill{font-size:5.6pt; padding:0.5mm 1.6mm;}
  .t-roll.r58 .rt-code-wrap{border-width:1.8px; padding:1.2mm 0.8mm 1.5mm; margin:1.2mm 0 1.6mm;}
  .t-roll.r58 .rt-code-lbl{font-size:5pt;}
  .t-roll.r58 .rt-code{font-size:14pt;}
  .t-roll.r58 .rt-inc{font-size:6.8pt; margin-bottom:1.4mm;}
  .t-roll.r58 .rt-how{font-size:5.8pt; padding-top:1.2mm;}
  .t-roll.r58 .rt-cut{margin:2.8mm 0.5mm 0.8mm;}
  .t-roll.r58 .rt-cut span{font-size:5pt; top:-1.8mm;}

  .empty{max-width:520px; margin:60px auto; text-align:center; font-weight:700; color:var(--muted);}
  @media print{
    body{background:#fff;}
    .bar{display:none;}
    .sheet{margin:0; box-shadow:none; break-after:page;}
    .sheet:last-child{break-after:auto;}
    .t-roll{margin:0 auto; box-shadow:none; padding:0;}
  }
</style>
</head>
<body>
<div class="bar">
  <div style="flex:1 1 220px;"><h1 id="ttl">Voucher tickets</h1><p id="meta"></p></div>
  <div class="bar-ctl">
    <div class="segs" id="fmtBar" role="radiogroup" aria-label="Paper format">
      <button type="button" class="seg" data-fmt="a4">A4 (10/page)</button>
      <button type="button" class="seg" data-fmt="thermal80">Thermal 80 mm</button>
      <button type="button" class="seg" data-fmt="thermal58">Thermal 58 mm</button>
    </div>
    <label class="cut-chk" id="cutWrap" hidden><input type="checkbox" id="cutEach" checked> Cut each ticket</label>
    <button class="btn" id="printBtn" type="button">Print tickets</button>
  </div>
</div>
<main id="out"></main>
<script>
(function(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem('pb_ticket_print') || 'null'); }catch(e){}
  var out = document.getElementById('out');
  var pageRule = document.getElementById('pageRule');
  var cutWrap = document.getElementById('cutWrap');
  var cutEachIn = document.getElementById('cutEach');
  var esc = function(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  if(!d || !d.codes || !d.codes.length){
    out.innerHTML = '<p class="empty">No vouchers to print. Go back to the booth (Setup → 7 Session → Payment &amp; vouchers) and tap “Print tickets”.</p>';
    document.getElementById('printBtn').disabled = true;
    return;
  }
  var peso = function(n){ return '₱' + Number(n || 0).toLocaleString('en-PH'); };
  var inc = (d.label && d.label !== '1 photo session' ? d.label : '1 photo session') + (d.prints ? ' · ' + d.prints + ' print' + (d.prints > 1 ? 's' : '') : '');
  var tierName = d.tier === 'receipt' ? 'Thermal' : (d.tier === 'photo' ? 'Color' : '');
  var badgePlain = d.tier === 'receipt' ? ((d.label ? d.label.toUpperCase() : 'THERMAL') + ' ONLY') : (d.tier === 'photo' ? ((d.label ? d.label.toUpperCase() : 'COLOR') + ' ONLY') : (d.label && d.label !== '1 photo session' ? d.label.toUpperCase() : ''));
  var kick = 'photobooth4u \u00b7 ' + (tierName ? tierName.toUpperCase() + ' VOUCHER' : 'VOUCHER');
  var tierBadge = d.tier === 'receipt' ? '<span style="display:inline-block; font-size:7pt; font-weight:800; background:#000; color:#fff; padding:1px 5px; border-radius:3px; margin-left:4px;">THERMAL</span>' : (d.tier === 'photo' ? '<span style="display:inline-block; font-size:7pt; font-weight:800; background:#0055ff; color:#fff; padding:1px 5px; border-radius:3px; margin-left:4px;">COLOR</span>' : '');
  document.getElementById('ttl').textContent = (d.event || 'Photo booth') + ' · ' + d.codes.length + ' voucher' + (d.codes.length === 1 ? '' : 's') + (tierName ? ' (' + tierName + ')' : '');

  var FMT_KEY = 'pb_ticket_page_fmt';
  var fmt = (d.format === 'thermal80' || d.format === 'thermal58' || d.format === 'a4') ? d.format : '';
  if(!fmt){
    try{ var sv = localStorage.getItem(FMT_KEY); if(sv === 'thermal80' || sv === 'thermal58' || sv === 'a4') fmt = sv; }catch(e){}
  }
  if(!fmt) fmt = d.tier === 'receipt' ? 'thermal80' : 'a4';
  var cutEach = typeof d.cutEach === 'boolean' ? d.cutEach : (fmt === 'thermal80');
  cutEachIn.checked = cutEach;

  function render(){
    var isThermal = fmt !== 'a4';
    document.querySelectorAll('#fmtBar .seg').forEach(function(b){ b.classList.toggle('active', b.dataset.fmt === fmt); });
    cutWrap.hidden = !isThermal;
    if(!isThermal){
      pageRule.textContent = '@page{ size:A4; margin:0; }';
      document.getElementById('meta').textContent = '10 per A4 page. Print at 100% (no scaling), cut along the dashed lines.';
      var per = 10, html = '';
      for(var i = 0; i < d.codes.length; i += per){
        html += '<section class="sheet">' + d.codes.slice(i, i + per).map(function(c){
          var cFmt = c.length === 8 ? (c.slice(0, 4) + ' ' + c.slice(4)) : c;
          return '<div class="t"><div class="top"><div><div class="kick">' + kick + tierBadge + '</div><div class="ev">' + esc(d.event || 'Photo booth') + '</div></div>' +
            (d.price ? '<div class="price">' + esc(peso(d.price)) + '</div>' : '') + '</div>' +
            '<div><div class="code">' + esc(cFmt) + '</div><div class="inc">' + esc(inc) + '</div></div>' +
            '<div class="how">Tap the booth screen → <b>I have a voucher</b> → type the 8 digits. Works once.</div>' +
            '</div>';
        }).join('') + '</section>';
      }
      out.innerHTML = html;
    } else {
      var is58 = fmt === 'thermal58';
      pageRule.textContent = is58 ? '@page{ size:58mm auto; margin:0; }' : '@page{ size:80mm auto; margin:0; }';
      document.getElementById('meta').textContent = (is58 ? '58 mm' : '80 mm') + ' thermal roll. Select your thermal printer, Margins: None, Scale: 100%.';
      var rollHtml = '<section class="t-roll ' + (is58 ? 'r58' : 'r80') + '">' + d.codes.map(function(c, idx){
        var cFmt = c.length === 8 ? (c.slice(0, 4) + ' ' + c.slice(4)) : c;
        var isLast = idx === d.codes.length - 1;
        return '<article class="rt' + (cutEach ? ' cut-each' : '') + '"><div class="rt-box">' +
          '<div class="rt-kick">PHOTOBOOTH4U · VOUCHER</div>' +
          '<div class="rt-ev">' + esc(d.event || 'Photo booth') + '</div>' +
          ((d.price || badgePlain) ? '<div class="rt-meta">' + (d.price ? '<span class="rt-price">' + esc(peso(d.price)) + '</span>' : '') + (badgePlain ? '<span class="rt-pill">' + esc(badgePlain) + '</span>' : '') + '</div>' : '') +
          '<div class="rt-code-wrap"><div class="rt-code-lbl">VOUCHER CODE</div><div class="rt-code">' + esc(cFmt) + '</div></div>' +
          '<div class="rt-inc">' + esc(inc) + '</div>' +
          '<div class="rt-how">Tap screen → “I have a voucher”<br>Enter the 8 digits · Valid once</div>' +
          '</div>' +
          ((!cutEach && !isLast) ? '<div class="rt-cut"><span>CUT HERE</span></div>' : '') +
          '</article>';
      }).join('') + '</section>';
      out.innerHTML = rollHtml;
    }
  }

  document.getElementById('fmtBar').addEventListener('click', function(e){
    var b = e.target.closest('[data-fmt]'); if(!b) return;
    fmt = b.dataset.fmt;
    if(fmt === 'thermal58') { cutEach = false; cutEachIn.checked = false; }
    else if(fmt === 'thermal80') { cutEach = true; cutEachIn.checked = true; }
    try{ localStorage.setItem(FMT_KEY, fmt); }catch(err){}
    render();
  });
  cutEachIn.addEventListener('change', function(){ cutEach = !!cutEachIn.checked; render(); });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  render();
  if(d.autoPrint === true){
    var go = function(){ setTimeout(function(){ try{ window.print(); }catch(e){} }, 350); };
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else window.addEventListener('load', go);
  }
})();
</script>
</body>
</html>
