<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Send photos to the booth</title>
<style>
  :root{--bg:#F6F1EA;--ink:#1C1A1E;--dim:#6B666C;--red:#C93D27;--green:#2EA66B;--line:#E4DCCF;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#17151a;--ink:#F3EEE6;--dim:#A39DA6;--line:#34303a;--card:#221f27}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 16px 40px;text-align:center}
  main{max-width:440px;margin:0 auto}
  h1{font-size:23px;line-height:1.2;margin:4px 0 6px}
  p{margin:6px 0;color:var(--dim)}
  .ev{font-weight:700;color:var(--ink);font-size:18px}
  label.pick{display:block;margin:16px 0 0;padding:18px 22px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:18px;cursor:pointer;touch-action:manipulation}
  label.alt{background:var(--ink);color:var(--bg)}
  input[type=file]{display:none}
  #list{margin-top:22px;text-align:left}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
  .row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 6px}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
  .st{color:var(--dim)}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
  #until{font-size:13px}
  #dead{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>Send photos to the booth</h1>
  <p class="ev" id="ev"></p>
  <p>Each photo goes to the booth, into the event frame, ready to print and share.</p>
  <div id="dead"><b>This link isn&rsquo;t working.</b><p id="deadWhy">Ask the booth to show the QR code again, then scan it.</p></div>
  <div id="ctl">
    <label class="pick" for="cam">Take a photo</label>
    <input id="cam" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
    <label class="pick alt" for="f">Choose photos</label>
    <input id="f" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <p id="until"></p>
  </div>
  <div id="list"></div>
</main>
<script>
(function(){
  // The booth's upload address. It must match DRIVE_SCRIPT_URL in the booth page.
  var SCRIPT = 'https://script.google.com/macros/s/AKfycbxv0WfF9rxFY9QlseCoSjrA7vePwHE-Uc8QTURZYyN6yIzcTj4SIlktEWT6Xnaw6Pv9OA/exec';
  var MAX_SIDE = 2400;                       // phone photos are shrunk to this before sending: about 1-2 MB each
  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function(p){ var i = p.indexOf('='); if(i > 0) params[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  var ticket = params.t || '';
  var $ = function(id){ return document.getElementById(id); };
  $('ev').textContent = params.e || '';

  // The ticket says when it stops working.
  var exp = 0;
  try{
    var body = ticket.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); while(body.length % 4) body += '=';
    exp = JSON.parse(atob(body)).exp || 0;
  }catch(e){}
  function dead(why){ $('ctl').style.display = 'none'; $('dead').style.display = 'block'; if(why) $('deadWhy').textContent = why; }
  if(!ticket || !exp) dead('The link is incomplete. Scan the QR code on the booth again.');
  else if(exp < Date.now()) dead('This link has expired. Ask the booth to show the QR code again, then scan it.');
  else $('until').textContent = 'This link works until ' + new Date(exp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.';

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function stamp(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  async function shrink(file){
    var bmp;
    try{ bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }catch(e){ bmp = await createImageBitmap(file); }
    var k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if(bmp.close) bmp.close();
    var blob = await new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.88); });
    if(!blob) throw new Error('This photo could not be opened.');
    return blob;
  }
  function toBase64(blob){
    return new Promise(function(res, rej){ var r = new FileReader(); r.onloadend = function(){ res(String(r.result).split(',')[1] || ''); }; r.onerror = rej; r.readAsDataURL(blob); });
  }
  async function post(name, b64){
    var r = await fetch(SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ filename: name, mimeType: 'image/jpeg', imageBase64: b64, ticket: ticket }) });
    var j = await r.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'Upload failed');
  }
  var cq=[], cRows={}, cDraining=false, cRetryT=0, cidbP=null;
  function cqDb(){
    if(cidbP)return cidbP;
    if(!window.indexedDB)return Promise.resolve(null);
    cidbP=new Promise(function(res){
      try{
        var req=indexedDB.open('pb4u_cloud_rove_q',1);
        req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains('q'))req.result.createObjectStore('q',{keyPath:'id'});};
        req.onsuccess=function(){res(req.result);};
        req.onerror=function(){res(null);};
      }catch(e){res(null);}
    });
    return cidbP;
  }
  function cqPut(it){return cqDb().then(function(db){if(!db)return;return new Promise(function(res){try{var tx=db.transaction('q','readwrite');tx.objectStore('q').put({id:it.id,name:it.name,label:it.label,b64:it.b64,at:it.at});tx.oncomplete=res;tx.onerror=res;}catch(e){res();}});});}
  function cqDel(id){return cqDb().then(function(db){if(!db)return;return new Promise(function(res){try{var tx=db.transaction('q','readwrite');tx.objectStore('q').delete(id);tx.oncomplete=res;tx.onerror=res;}catch(e){res();}});});}
  function cqLoadAll(){return cqDb().then(function(db){if(!db)return[];return new Promise(function(res){try{var tx=db.transaction('q','readonly'),r=tx.objectStore('q').getAll();r.onsuccess=function(){var a=r.result||[];a.sort(function(x,y){return(x.at||0)-(y.at||0);});res(a);};r.onerror=function(){res([]);};}catch(e){res([]);}});});}
  function mkRow(id, label, msg){
    if(cRows[id])return cRows[id];
    var row=document.createElement('div'); row.className='row';
    row.innerHTML='<b></b><div class="bar"><i></i></div><span class="st"></span>';
    row.querySelector('b').textContent=label||'photo';
    row.querySelector('.st').textContent=msg||'Getting ready…';
    $('list').insertBefore(row,$('list').firstChild);
    cRows[id]=row; return row;
  }
  async function drainCloud(){
    if(cDraining||!cq.length)return;
    cDraining=true;
    try{
      while(cq.length){
        var it=cq[0], row=mkRow(it.id,it.label,'Sending…'), bar=row.querySelector('i'), st=row.querySelector('.st');
        bar.style.width='55%'; st.className='st'; st.textContent='Sending…';
        try{
          await post(it.name, it.b64);
          bar.style.width='100%'; st.className='st ok'; st.textContent='Sent. It will appear on the booth in a few seconds.';
          cq.shift(); await cqDel(it.id);
        }catch(e){
          if(/ticket|not allowed|expired/i.test(String(e&&e.message))){
            st.className='st bad'; st.textContent='This link has expired. Ask the booth to show the QR code again.';
            cq.shift(); await cqDel(it.id);
          }else{
            st.className='st'; st.textContent='⏳ Offline queued — auto-sends once internet reconnects.';
            clearTimeout(cRetryT); cRetryT=setTimeout(drainCloud, 4500);
            break;
          }
        }
      }
    }finally{cDraining=false;}
  }
  async function prepareAndQueue(file){
    var id='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
    var label=file.name||'photo';
    var row=mkRow(id,label,'Getting ready…'), bar=row.querySelector('i'), st=row.querySelector('.st');
    try{
      var blob=await shrink(file); bar.style.width='25%';
      var b64=await toBase64(blob); bar.style.width='45%';
      var it={id:id,name:'rove_'+stamp()+'.jpg',label:label,b64:b64,at:Date.now()};
      cq.push(it); await cqPut(it);
      drainCloud();
    }catch(e){
      st.className='st bad'; st.textContent='This photo could not be opened.';
    }
  }
  function pick(e){ Array.prototype.forEach.call(e.target.files, prepareAndQueue); e.target.value = ''; }
  $('f').addEventListener('change', pick); $('cam').addEventListener('change', pick);
  window.addEventListener('online', drainCloud);
  window.addEventListener('focus', function(){ if(cq.length) drainCloud(); });
  cqLoadAll().then(function(items){
    items.forEach(function(it){ if(!it||!it.id||!it.b64)return; mkRow(it.id,it.label,'⏳ Restored queued photo — waiting for connection…'); cq.push(it); });
    if(cq.length) drainCloud();
  });
})();
</script>
</body>
</html>
