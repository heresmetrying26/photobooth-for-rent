<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>photobooth4u – Facebook profile picture</title>
<style>
@font-face{font-family:'Fraunces';font-weight:600;src:url('../docs/setup-guide/fonts/fraunces-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Manrope';font-weight:800;src:url('../docs/setup-guide/fonts/manrope-latin-800-normal.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#F5F1EA}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Manrope',sans-serif;color:#1C1A1E}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:280px;height:280px;margin-bottom:50px}
.mark i{background:#1C1A1E;border-radius:32px}
.mark i:nth-child(2){background:#C93D27}
.word{display:flex;align-items:flex-start}
.word b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:118px;letter-spacing:-0.035em;line-height:1}
.word em{font-style:normal;margin-left:11px;margin-top:-4px;padding:9px 20px 13px;border-radius:24px;background:#C93D27;color:#fff;font-weight:800;font-size:46px;line-height:1;transform:rotate(-7deg)}
</style></head>
<body>
  <div class="mark"><i></i><i></i><i></i><i></i></div>
  <div class="word"><b>photobooth</b><em>4u</em></div>
</body></html>
